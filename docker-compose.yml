x-app: &app
  build: .
  image: rsl-blockchain-pqc:dev
  working_dir: /app
  # Same uid as the host user so files written to the bind mount are not root-owned (CI sets HOST_UID/HOST_GID).
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  volumes:
    - .:/app
    # anonymous volume: node_modules always comes from the image, never from a stale volume
    - /app/node_modules

services:
  test:
    <<: *app
    command: npm run check

  build:
    <<: *app
    command: npm run build

  package:
    <<: *app
    command: npm run package

  encrypt:
    <<: *app
    command: npm run encrypt
    stdin_open: true
    tty: true

  dev:
    <<: *app
    command: npm run dev
    ports:
      - "8000:8000"
